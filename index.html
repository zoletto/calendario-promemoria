<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Appuntamenti Counseling</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <h2>Nuovo Appuntamento</h2>
        
        <form id="appointment-form">
            <div class="form-group">
                <label for="client-name">Nome:</label>
                <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                    <input type="text" id="client-name" required style="flex: 1; padding: 8px; font-size: 16px;">
                    <button type="button" id="btn-contacts" style="padding: 0 12px; background-color: #6200ee; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">📇 Rubrica</button>
                </div>
            </div>

            <div class="form-group">
                <label for="client-phone">Telefono:</label>
                <input type="tel" id="client-phone" required style="width: 100%; padding: 8px; font-size: 16px; margin-bottom: 10px;">
            </div>

            <div class="form-group">
                <label for="appointment-date">Data e Ora:</label>
                <input type="datetime-local" id="appointment-date" required style="width: 100%; padding: 8px; font-size: 16px; margin-bottom: 15px;">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; background-color: #03dac6; color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Salva e Sincronizza</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
    </div>

    <script src="app.js"></script>
</body>
</html>
